# Release configuration for the client CLI.
#
# One binary, six targets, no build hooks -- `stone` is a plain Go client with
# nothing embedded in it, which is the whole difference between this file and the
# platform's. It talks to a running server over HTTPS and NATS, so there is no
# console to compile first and no reason to ship anything but the binary.
#
# The binary is `stone`; the repo and module are `stone-cli`. Archives are named
# after the binary, because that is the name a user types and searches for.
version: 2

project_name: stone-cli

builds:
  - id: stone
    main: .
    binary: stone
    env:
      # Nothing in the dependency tree needs cgo, so every target below
      # cross-compiles from one runner.
      - CGO_ENABLED=0
    ldflags:
      # cmd.version is unexported, which -X handles fine; it is read into
      # rootCmd.Version at init, after the linker has written it.
      - -s -w -X github.com/stone-age-io/stone-cli/cmd.version={{.Version}}
    goos: [linux, darwin, windows]
    # windows/arm64 is included here and excluded in the platform, deliberately:
    # this is a laptop and CI-runner tool, and ARM Windows laptops exist. A
    # server binary has no such audience.
    goarch: [amd64, arm64]

archives:
  - id: stone
    ids: [stone]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      # The audience-neutral description of the command surface, for people
      # driving the CLI from another tool or assistant. It travels with the
      # binary because it documents exactly this version's commands.
      - SKILLS.md
    name_template: >-
      stone_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# The release body is NOT built here. goreleaser's changelog is a list of commit
# subjects, and this repo's reasoning lives in CHANGELOG.md as paragraphs -- the
# part that matters to an operator (that a flag which used to report success was
# writing nothing) exists nowhere in the commit log. scripts/release-notes.sh
# assembles the whole body (install prose + the changelog section for the tag)
# and the release workflow passes it with --release-notes, which makes
# everything below inert on a real release.
#
# DO NOT set `disable: true` here. It looks like the tidy way to say "the body
# comes from elsewhere", and it silently breaks --release-notes: reading that
# file is a step INSIDE the changelog pipe, so disabling the pipe skips the read
# and publishes an empty body. The platform shipped v0.5.0 that way and had to
# edit it by hand afterwards. The settings below are the fallback for someone
# running goreleaser without the flag, and the only thing that suppresses them is
# the flag itself.
#
# release.header / release.footer are gone for the adjacent reason: goreleaser
# does not apply them to a --release-notes body, so keeping them here would be
# prose that renders on a manual run and vanishes on a real one. The install
# prose lives in scripts/release-notes.sh, which is the one place the body is
# assembled.
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: stone-age-io
    name: stone-cli
  # A tag carrying a prerelease suffix (v0.3.1-rc1) is published as a GitHub
  # prerelease. The default is false, which would mark a release candidate as
  # "Latest" on the repository front page and hand it to anyone following the
  # releases feed. It pairs with release-notes.sh, which reads `## [Unreleased]`
  # for exactly those tags.
  prerelease: auto
